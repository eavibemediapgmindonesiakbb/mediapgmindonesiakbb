<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGM Indonesia KBB</title>

<style>
/* ===================== GLOBAL ===================== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f1f5f9;padding-bottom:80px;}

/* HEADER */
.header{
  background:linear-gradient(135deg,#0f766e,#115e59);
  color:white;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
}

.header-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
}

/* BUTTON */
.login-btn{
  background:#22c55e;border:none;
  padding:8px 14px;border-radius:8px;
  color:white;cursor:pointer;
}

.menu-toggle{
  display:none;
  background:none;border:none;
  color:white;font-size:28px;
}

/* LAYOUT */
.container{display:flex;min-height:100vh;}
.sidebar{
  width:260px;background:#fff;
  padding:15px;border-right:1px solid #e5e7eb;
  display:flex;flex-direction:column;
}
.content{flex:1;padding:20px;}

/* MENU */
.menu-btn{
  width:100%;
  margin:6px 0;
  padding:10px;
  border:none;
  background:#16a34a;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
.menu-btn.active{background:#0f766e;}

/* CARD */
.download-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}
.download-card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.06);
}
.download-btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:#0f766e;
  color:white;
  border:none;
  border-radius:10px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  background:white;
  border-top:1px solid #ddd;
  z-index:999;
}

.nav-item{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:12px;
  cursor:pointer;
}

.nav-item.active{
  color:#0f766e;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:768px){
  .container{flex-direction:column;}
  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    height:100%;
    width:260px;
    transition:0.3s;
    z-index:998;
  }
  .sidebar.show{left:0;}
  .menu-toggle{display:block;}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

  <div class="header-center">
    <img src="https://i.imgur.com/aLYPqyB.png" width="40">
    <div>
      <b>PGM Indonesia KBB</b><br>
      <small>Perkumpulan Guru Madrasah</small>
    </div>
  </div>

  <button class="login-btn">Login</button>
</div>

<!-- CONTAINER -->
<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <button class="menu-btn active" data-page="home" onclick="setPage(this)">🏠 Beranda</button>
    <button class="menu-btn" data-page="pendataan" onclick="setPage(this)">📋 Pendataan</button>
    <button class="menu-btn" data-page="anggota" onclick="setPage(this)">👥 Anggota</button>
    <button class="menu-btn" data-page="download" onclick="setPage(this)">⬇ Download</button>
    <button class="menu-btn" data-page="info" onclick="setPage(this)">📢 Info</button>

  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <h2>Selamat Datang 👋</h2>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <div class="nav-item active" onclick="setPage(document.querySelector('[data-page=home]'))">🏠<br>Home</div>

  <div class="nav-item" onclick="setPage(document.querySelector('[data-page=pendataan]'))">📋<br>Data</div>

  <div class="nav-item" onclick="setPage(document.querySelector('[data-page=download]'))">⬇<br>Download</div>

  <div class="nav-item" onclick="setPage(document.querySelector('[data-page=info]'))">📢<br>Info</div>

</div>

<!-- SCRIPT -->
<script>

let totalAnggotaGlobal = 0;

function setPage(el){

  if(!el) return;

  // sidebar menu active
  document.querySelectorAll('.menu-btn')
  .forEach(b => b.classList.remove('active'));

  if(el.classList.contains('menu-btn')){
    el.classList.add('active');
  }

  // bottom nav active reset
  document.querySelectorAll('.nav-item')
  .forEach(n => n.classList.remove('active'));

  let page = el.getAttribute('data-page');
  let content = document.getElementById('content');

  /* HOME */
  if(page === 'home'){
    content.innerHTML = `
      <h2>Home</h2>
      <p>Sistem PGM Indonesia KBB</p>
    `;
  }

  /* PENDATAAN */
  if(page === 'pendataan'){
    content.innerHTML = `
      <h2>Pendataan</h2>
      <p>Form tersedia</p>
    `;
  }

  /* DOWNLOAD */
  if(page === 'download'){
    content.innerHTML = `
      <h2>Download</h2>
      <div class="download-card">
        <h3>Sertifikat</h3>
        <button class="download-btn"
        onclick="window.open('https://script.google.com/macros/s/AKfycbxaHnWeBbzXVWvoIk8ZBdTBDCeYbyAeIhMb-k2AEH3ctpMgCQo2jSKFWLoZdNbvegl8vw/exec')">
        Download
        </button>
      </div>
    `;
  }

  /* INFO */
  if(page === 'info'){
    content.innerHTML = `<h2>Info</h2>`;
  }

  /* close sidebar HP */
  if(window.innerWidth < 768){
    document.querySelector('.sidebar').classList.remove('show');
  }
}

function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('show');
}

</script>

</body>
</html>
