<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGM KBB PRO SYSTEM</title>

<!-- QR + PDF -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9;}
header{background:#0f766e;color:white;padding:12px;text-align:center;}

.container{display:flex;}
.sidebar{
  width:230px;
  background:white;
  min-height:100vh;
  padding:10px;
}
.content{flex:1;padding:15px;}

.btn{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  background:#16a34a;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

.card{
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input,select,button{
  width:100%;
  padding:10px;
  margin:5px 0;
}
img{width:80px;height:80px;border-radius:50%;object-fit:cover;}
</style>
</head>

<body>

<header>
PGM KBB ADMIN PRO SYSTEM
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button class="btn" onclick="page('dashboard')">Dashboard</button>
<button class="btn" onclick="page('add')">Tambah Anggota</button>
<button class="btn" onclick="page('list')">Data Anggota</button>
</div>

<!-- CONTENT -->
<div class="content" id="content">Loading...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "ISI_API_KEY",
authDomain: "ISI_AUTH",
projectId: "ISI_PROJECT",
storageBucket: "ISI_BUCKET"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let qrCache = "";

/* =====================
PAGE SYSTEM
===================== */
window.page = async function(p){

let c = document.getElementById("content");

/* DASHBOARD */
if(p=="dashboard"){
c.innerHTML = `<h2>Dashboard Aktif</h2>`;
}

/* ADD ANGGOTA */
if(p=="add"){
c.innerHTML = `
<h2>Tambah Anggota</h2>

<input id="nama" placeholder="Nama">
<input id="kta" placeholder="KTA">
<input id="lembaga" placeholder="Lembaga">
<input id="wilayah" placeholder="Wilayah">

<input type="file" id="foto">

<button onclick="save()">Simpan + QR + PDF Ready</button>
`;
}

/* LIST */
if(p=="list"){

let snap = await getDocs(collection(db,"anggota"));
let html = "<h2>Data Anggota</h2>";

snap.forEach(d=>{
let x = d.data();

html += `
<div class="card">
<img src="${x.fotoURL}">
<h3>${x.nama}</h3>
<p>${x.kta}</p>
<p>${x.lembaga}</p>
<p>${x.wilayah}</p>

<button onclick='cetak(${JSON.stringify(JSON.stringify(x))})'>
Cetak KTA
</button>

<button onclick="hapus('${d.id}')">Hapus</button>
</div>
`;
});

c.innerHTML = html;
}

}

/* =====================
SAVE DATA + FOTO + QR
===================== */
window.save = async function(){

let file = document.getElementById("foto").files[0];

let fileRef = ref(storage,"anggota/"+Date.now());
await uploadBytes(fileRef,file);
let fotoURL = await getDownloadURL(fileRef);

let data = {
nama:nama.value,
kta:kta.value,
lembaga:lembaga.value,
wilayah:wilayah.value,
fotoURL:fotoURL
};

await addDoc(collection(db,"anggota"),data);

/* WA NOTIF */
let msg = `Halo ${nama.value}, data Anda sudah terdaftar. KTA: ${kta.value}`;
window.open(`https://wa.me/62XXXXXXXXXX?text=${encodeURIComponent(msg)}`);

alert("Tersimpan + WA terkirim");
page("list");
}

/* =====================
DELETE
===================== */
window.hapus = async function(id){
await deleteDoc(doc(db,"anggota",id));
page("list");
}

/* =====================
CETAK KTA PDF
===================== */
window.cetak = async function(data){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFillColor(15,118,110);
doc.rect(0,0,210,297,'F');

doc.setTextColor(255,255,255);
doc.setFontSize(18);
doc.text("KARTU ANGGOTA PGM KBB",20,30);

doc.setFontSize(12);
doc.text("Nama: "+data.nama,20,60);
doc.text("KTA: "+data.kta,20,75);
doc.text("Lembaga: "+data.lembaga,20,90);
doc.text("Wilayah: "+data.wilayah,20,105);

/* FOTO */
if(data.fotoURL){
const img = await toBase64(data.fotoURL);
doc.addImage(img,"JPEG",140,50,50,50);
}

doc.save("KTA-"+data.nama+".pdf");
}

/* =====================
IMAGE CONVERT
===================== */
function toBase64(url){
return fetch(url)
.then(r=>r.blob())
.then(b=>{
return new Promise(res=>{
let f=new FileReader();
f.onload=()=>res(f.result);
f.readAsDataURL(b);
});
});
}

page("dashboard");

</script>

</body>
</html>
